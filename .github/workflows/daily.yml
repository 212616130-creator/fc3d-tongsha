name: fc3d-tongsha-daily

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fc3d-tongsha-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          pip install numpy requests

      # 4. 更新数据、重新计算、生成 HTML
      - name: Update data and build HTML
        run: |
          python update.py

      # 5. 提交数据和网页
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add fc3d-history.csv
          git add index.html

          if git diff --cached --quiet; then
            echo "没有文件变化"
          else
            git commit -m "🤖 自动更新福彩3D数据"
            git push
          fi

      # 6. 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. 准备网站文件
      - name: Prepare Pages
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html

      # 8. 上传 Pages 文件
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      # 9. 部署 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
